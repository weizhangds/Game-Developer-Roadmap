<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Godot 独立游戏开发 · 学习路线图（细化版）</title>
<style>
:root{
  --bg:#0d1117; --bg2:#111823; --card:#151d2a; --line:#232d3d; --line2:#2d3a4d;
  --text:#e6edf6; --dim:#8b9bb0; --dim2:#64748b;
  --must:#f7768e; --later:#e0af68; --skip:#5c6b80;
  --c0:#5c6b80; --c1:#e0af68; --c2:#3fb950; --acc:#58a6ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 50% -100px,#16202e,transparent),var(--bg);
  color:var(--text);
  font:16px/1.6 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei","PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}

/* ---- hero ---- */
.hero{padding:56px 0 26px}
h1{margin:0 0 14px;font-size:38px;line-height:1.25;letter-spacing:.5px}
h1 .dot{color:#3fb950}
.sub{margin:0;color:var(--dim);font-size:16px;max-width:820px}
.sub b{color:var(--text);font-weight:600}
.legend{margin:16px 0 0;color:var(--dim2);font-size:13px;line-height:1.9}
.legend kbd{background:#1c2534;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:12px;color:var(--dim)}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* progress row */
.prow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:26px 0 10px}
.pb{flex:1 1 240px;min-width:200px;height:10px;border-radius:6px;background:#232b3a;overflow:hidden}
.pb>i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#2f81f7,#3fb950);transition:width .25s}
.pct{flex:0 0 auto;font-size:16px;color:#f2f5fa;white-space:nowrap;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:22px;flex-wrap:wrap;align-items:center;color:var(--dim);font-size:15px}
.stats b{color:var(--text);font-variant-numeric:tabular-nums}
.stats .k{display:inline-flex;align-items:center;gap:7px}

/* next up */
.nextup{margin:26px 0 0;background:linear-gradient(180deg,#14202e,#121a26);border:1px solid #1f3d2d;border-radius:14px;padding:18px 22px}
.nextup h3{margin:0 0 10px;font-size:15px;color:#56d364;letter-spacing:.3px}
.nextup ol{margin:0;padding-left:20px;color:#cfdae8;font-size:15px}
.nextup li{margin:6px 0}
.nextup .tiny{color:var(--dim2);font-size:13px}

/* ---- toolbar ---- */
.toolbar{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-top:30px}
.tb-inner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{cursor:pointer;user-select:none;background:#141c28;border:1px solid var(--line2);color:var(--dim);border-radius:999px;padding:6px 13px;font-size:13.5px;transition:.15s}
.chip:hover{color:var(--text);border-color:#3d4c63}
.chip.on{background:#1b2a3d;border-color:#2f81f7;color:#cfe3ff}
.spacer{flex:1 1 auto}
input.q{width:200px;background:#0f1620;border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:7px 11px;font-size:13.5px;outline:none}
input.q:focus{border-color:#2f81f7}
.btn{cursor:pointer;background:#141c28;border:1px solid var(--line2);color:var(--dim);border-radius:9px;padding:6px 11px;font-size:13px}
.btn:hover{color:var(--text);border-color:#3d4c63}

/* ---- phases ---- */
#app{padding:34px 0 90px}
.phase{margin:0 0 46px}
.phase-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ptag{background:#1a2536;color:#8fb8ff;border-radius:7px;padding:2px 9px;font-size:12.5px;letter-spacing:.5px}
.ptitle{margin:0;font-size:25px;letter-spacing:.5px}
.pwhen{color:var(--dim2);font-size:13px}
.pmeta{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px}
.pmeta .mb{width:110px;height:6px;border-radius:4px;background:#1e2836;overflow:hidden}
.pmeta .mb>i{display:block;height:100%;background:linear-gradient(90deg,#2f81f7,#3fb950)}
.pgoal{margin:14px 0 4px;color:var(--dim);font-size:15px}
.pgoal b{color:#dbe6f3;font-weight:600}

.grp{margin:22px 0 0}
.grp-h{display:flex;align-items:center;gap:10px;color:var(--dim2);font-size:13px;letter-spacing:.6px;margin:0 0 12px}
.grp-h:after{content:"";flex:1;height:1px;background:var(--line)}

/* goal card */
.goal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0;margin:0 0 12px;overflow:hidden}
.goal.s0{border-left:3px solid #2b3646}
.goal.s1{border-left:3px solid var(--c1)}
.goal.s2{border-left:3px solid var(--c2)}
.goal-h{display:flex;align-items:center;gap:10px;padding:12px 15px;flex-wrap:wrap;cursor:pointer}
.goal-h:hover{background:#18202e}
.chev{width:14px;color:var(--dim2);font-size:11px;transition:transform .15s}
.goal.closed .chev{transform:rotate(-90deg)}
.gname{font-size:15.5px;font-weight:600;letter-spacing:.2px}
.lv{font-size:11.5px;border-radius:6px;padding:1px 7px;border:1px solid transparent}
.lv.must{color:#ffb3c0;background:#3a1c24;border-color:#5c2b36}
.lv.later{color:#ffd9a0;background:#3a2c14;border-color:#5c4720}
.lv.skip{color:#93a1b3;background:#232b36;border-color:#333e4d}
.tm{color:var(--dim2);font-size:12.5px}
.gp{margin-left:auto;display:flex;align-items:center;gap:9px}
.gp .tiny{color:var(--dim2);font-size:12.5px;font-variant-numeric:tabular-nums}
.gstat{font-size:12px;border-radius:999px;padding:2px 9px;white-space:nowrap}
.gstat.s0{color:#8b9bb0;background:#1c2534}
.gstat.s1{color:#ffd9a0;background:#33290f}
.gstat.s2{color:#8ff0a4;background:#12301c}

.goal-b{padding:0 15px 13px 15px}
.chk{margin:0 0 10px;color:var(--dim2);font-size:12.5px}
.chk b{color:#9fb3c8;font-weight:600}
.tasks{display:flex;flex-direction:column;gap:1px}
.task{display:flex;gap:9px;align-items:flex-start;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:14px;color:#c6d3e2;line-height:1.55}
.task:hover{background:#1a2333;color:#e6edf6}
.task .bd{flex:0 0 auto;width:14px;height:14px;margin-top:4px;border-radius:50%;border:1.6px solid #44536a;position:relative}
.task.t1 .bd{border-color:var(--c1);background:radial-gradient(circle,var(--c1) 0 3.2px,transparent 3.6px)}
.task.t2 .bd{border-color:var(--c2);background:var(--c2)}
.task.t2 .bd:after{content:"";position:absolute;left:3.2px;top:0.6px;width:4px;height:7px;border:1.7px solid #0d1117;border-top:0;border-left:0;transform:rotate(42deg)}
.task.t2 .tx{color:#7e8ea4}
.task.t1 .tx{color:#dfe8f3}
.goal.closed .goal-b{display:none}
.empty{color:var(--dim2);text-align:center;padding:50px 0;font-size:15px}
@media(max-width:720px){
  h1{font-size:29px}
  .pmeta{margin-left:0;width:100%}
  input.q{width:100%}
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>Godot 独立游戏开发 · 学习路线图 <span class="dot">.</span></h1>
    <p class="sub">
      大目标（每一项技能）拆成可点击的小目标（具体动作）。每个小目标都能标 <b>未学 / 学习中 / 已学</b>；
      大目标的状态由小目标自动汇总，<b>Shift+点大目标</b>可一键整组标记。进度存在本机浏览器里。
    </p>
    <div class="legend">
      <span class="sw" style="background:#44536a"></span>未学
      <span style="margin:0 14px 0 4px"></span>
      <span class="sw" style="background:#e0af68"></span>学习中
      <span style="margin:0 14px 0 4px"></span>
      <span class="sw" style="background:#3fb950"></span>已学
      &nbsp;·&nbsp;
      <kbd>点小目标</kbd> 三态切换 &nbsp;
      <kbd>Shift</kbd>+点 反向 &nbsp;
      <kbd>点大目标标题</kbd> 折叠 &nbsp;
      <kbd>Shift</kbd>+点 整组标记
    </div>

    <div class="prow">
      <div class="pb"><i id="barAll"></i></div>
      <div class="pct"><span id="pctAll">0%</span> · <span id="fracAll">0/0</span></div>
    </div>
    <div class="stats">
      <span class="k"><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#3fb950"></span>已学 <b id="n2">0</b></span>
      <span class="k"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#e0af68"></span>学习中 <b id="n1">0</b></span>
      <span class="k"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#44536a"></span>未学 <b id="n0">0</b></span>
      <span id="skipNote" style="color:#64748b;font-size:13px"></span>
    </div>

    <div class="nextup">
      <h3>接下来该做的 3 件事</h3>
      <ol id="nextList"></ol>
      <div class="tiny" id="nextHint"></div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap tb-inner">
    <div class="chips" id="filters">
      <div class="chip on" data-f="all">全部</div>
      <div class="chip" data-f="must">只看必修</div>
      <div class="chip" data-f="0">未学</div>
      <div class="chip" data-f="1">学习中</div>
      <div class="chip" data-f="2">已学</div>
      <div class="chip" id="hideSkip">隐藏可跳过</div>
    </div>
    <div class="spacer"></div>
    <input class="q" id="q" placeholder="搜索技能 / 小目标…">
    <button class="btn" id="exportBtn">备份</button>
    <button class="btn" id="importBtn">恢复</button>
    <button class="btn" id="resetBtn">重置</button>
  </div>
</div>

<main id="app"><div class="wrap"></div></main>

<script>
/* ============================================================
   数据结构
   阶段: {id,t(标题),w(时间),goal(阶段大目标),gs:[{name(分组),items:[目标…]}]}
   目标: {id,n(名称),lv(must|later|skip),tm(预计时间),chk(验收标准),ts:[小目标…]}
   小目标状态: 0 未学 / 1 学习中 / 2 已学，存 localStorage
   ============================================================ */
const PHASES=[
{
  id:"p0", t:"编程地基", w:"大一上 — 寒假",
  goal:"把「想法 → 能跑的代码」这条路打通：C 写熟，再用三个控制台小游戏把游戏逻辑练成肌肉记忆。",
  gs:[
   {name:"C 语言核心", items:[
     {id:"c_syntax", n:"C 语法核心", lv:"must", tm:"约 3 周", chk:"不查资料写出 200 行以内、能编译运行的程序", ts:[
       "变量与类型：int/float/char 的声明、初始化、printf 格式化输出",
       "运算符与表达式：算术、比较、逻辑运算，优先级不清楚就加括号",
       "分支：if / else if / else、switch 与漏写 break 的坑",
       "循环：for / while / do-while，会写嵌套循环和提前 break",
       "函数：参数、返回值、局部变量作用域、声明与定义分开写",
       "数组与字符串：遍历、下标越界、strlen / strcpy / strcmp 会用"
     ]},
     {id:"c_ptr", n:"指针与内存模型", lv:"must", tm:"约 4 周", chk:"能画出「变量—地址—指针」的关系图，并解释一次崩溃的原因", ts:[
       "地址与解引用：& 取地址、* 取值，先在纸上画出内存格",
       "指针与数组：数组退化成指针、指针算术、用指针遍历数组",
       "函数传参：按值传递 vs 传指针修改调用方的变量",
       "动态内存：malloc / calloc / free，写一次「谁分配谁释放」",
       "常见崩溃：野指针、越界写、重复 free、内存泄漏，各复现一次"
     ]},
     {id:"c_struct", n:"结构体与自定义类型", lv:"must", tm:"约 3 周", chk:"用结构体数组写出「玩家 + 敌人列表」并正确更新", ts:[
       "struct 的定义、初始化、成员访问",
       "typedef 起别名、结构体数组、嵌套结构体",
       "结构体指针与 -> 运算符、按值 vs 按指针传结构体",
       "enum 表示游戏状态（菜单 / 游戏中 / 暂停 / 结算）"
     ]},
     {id:"c_file", n:"文件读写与存档", lv:"later", tm:"约 2 周", chk:"能把游戏进度写进文件、下次启动读回来", ts:[
       "fopen / fclose 的模式区别（r / w / a / b）",
       "fprintf / fscanf 写入与读取结构化的存档",
       "解析文本配置：一行一项、跳过注释行、容错空行",
       "出错处理：文件不存在、内容被改坏时不能直接崩"
     ]}
   ]},
   {name:"三个 C 小游戏（真正的核心练习）", items:[
     {id:"cg_sokoban", n:"文字版推箱子", lv:"must", tm:"约 2 周", chk:"能连续玩通一关，箱子不会被推进墙里", ts:[
       "用二维数组表示地图：墙 / 地板 / 箱子 / 目标点 / 玩家",
       "读键盘输入（方向键或 WASD），更新玩家坐标",
       "判定规则：箱子前方是空位才能推、全部箱子到目标才算过关",
       "清屏 + 重绘，让字符画面真正「动」起来"
     ]},
     {id:"cg_snake", n:"控制台贪吃蛇", lv:"must", tm:"约 2 周", chk:"能玩、能死、能重开，最高分能存下来", ts:[
       "用数组或环形缓冲维护身体坐标，理解「头进尾出」",
       "固定节拍更新：sleep + 重绘，而不是死循环刷屏",
       "碰撞判定：撞墙、撞到自己、吃到食物变长",
       "分数与最高分落盘（复用前面的文件读写）"
     ]},
     {id:"cg_shooter", n:"文字版打飞机", lv:"must", tm:"约 2 周", chk:"屏幕上有敌人和子弹在动，击中会消失、分数会涨", ts:[
       "结构体数组存敌人和子弹，每项带 alive 标志",
       "生成逻辑：按计时或概率刷新敌人",
       "每帧遍历更新位置，把死掉的标记为空位等待复用",
       "碰撞：用坐标距离判断，而不是精确矩形"
     ]}
   ]},
   {name:"工具与工作流", items:[
     {id:"tool_git", n:"Git 基础", lv:"must", tm:"约 1 周", chk:"能从零建库、提交、推到 GitHub，并看懂 diff", ts:[
       "init / add / commit / log / diff 日常五连",
       ".gitignore 排除编译产物和编辑器垃圾文件",
       "GitHub 建远程仓库、push、pull，处理一次冲突",
       "学会看 diff 而不是靠眼睛比对两份文件"
     ]},
     {id:"tool_shell", n:"命令行基础", lv:"must", tm:"约 1 周", chk:"不用鼠标也能建目录、编译、运行一个 C 程序", ts:[
       "路径：相对 / 绝对、cd / ls / cp / mv / rm",
       "重定向与管道：> >> | 的实际用途",
       "环境变量与 PATH，知道为什么「命令找不到」",
       "一条命令编译并运行：gcc 加参数，会读报错里的行号"
     ]},
     {id:"tool_editor", n:"编辑器 / IDE 配置", lv:"must", tm:"约 3 天", chk:"敲代码时几乎不用碰鼠标", ts:[
       "一个顺手的编辑器 + 语法高亮 + 自动补全",
       "保存自动格式化、统一缩进",
       "跳转到定义 / 查找引用，用来看别人的代码"
     ]},
     {id:"tool_en", n:"英文技术文档阅读", lv:"must", tm:"长期，每天 10 分钟", chk:"能靠搜索在官方文档里定位到某个 API 页", ts:[
       "每天读一页官方文档，抓关键词不逐字翻译",
       "用搜索直接跳到具体 API / 教程页",
       "生词先猜后查，禁止整句机翻"
     ]}
   ]},
   {name:"C# 预习（寒假，轻量）", items:[
     {id:"cs_basic", n:"C# 语法与类型系统", lv:"later", tm:"寒假 1–2 周", chk:"能用 dotnet 建一个控制台项目并跑通", ts:[
       "类与对象、字段 / 属性、构造函数",
       "集合：List 与 Dictionary 的基本用法",
       "null 与可空类型、字符串插值 $…{}",
       "dotnet new console / dotnet run 跑起来"
     ]},
     {id:"cs_oop", n:"面向对象与组合优先", lv:"later", tm:"用到再学", chk:"能解释为什么游戏里组合比继承更好维护", ts:[
       "继承 vs 组合的取舍，别滥用继承树",
       "接口描述「能力」，一个类可实现多个接口",
       "委托与事件——它就是 Godot 信号在 C# 里的样子"
     ]}
   ]}
  ]
},
{
  id:"p1", t:"Godot 引擎核心", w:"大一寒假 — 大二上",
  goal:"一个引擎用透：能把任何「我想做个这样的」的小点子，独立翻译成场景 + 脚本 + 信号。",
  gs:[
   {name:"引擎心智模型", items:[
     {id:"gd_editor", n:"Godot 4 编辑器", lv:"must", tm:"约 1 周", chk:"不看教程也能新建项目、加场景、运行调试", ts:[
       "场景面板 / 检查器 / 文件系统 / 输出面板各干什么",
       "新建场景、保存为 .tscn、设为启动场景",
       "运行与「运行当前场景」的区别，中断点看输出"
     ]},
     {id:"gd_tree", n:"场景与节点树", lv:"must", tm:"约 1 周", chk:"能解释「场景即预制体、节点即组件」", ts:[
       "节点树就是父子层级，位置、变换、可见性都随父节点",
       "场景可嵌套：把敌人做成场景，在主场景里实例化多个",
       "get_node / $ / %（唯一名）三种取节点方式"
     ]},
     {id:"gd_lifecycle", n:"Node 生命周期", lv:"must", tm:"约 3 天", chk:"能说出 _ready 与 _process 各在什么时候被调用", ts:[
       "_enter_tree / _ready / _exit_tree 的调用时机",
       "_process（每帧）与 _physics_process（固定步长）什么时候用哪个",
       "queue_free 是延迟销毁，不是立即释放"
     ]},
     {id:"gd_inst", n:"场景实例化与复用", lv:"must", tm:"约 3 天", chk:"能不写死节点、用代码动态生成一堆敌人", ts:[
       "preload / load 的区别与用法",
       "instantiate() 之后必须 add_child 才会出现",
       "把生成逻辑写进独立场景或 Autoload，别塞进主场景脚本"
     ]},
     {id:"gd_signal", n:"信号（Signal）", lv:"must", tm:"约 1 周", chk:"两个节点之间只靠信号通信，没有互相持有引用", ts:[
       "内置信号：按钮 pressed、Area2D 的 body_entered",
       "自定义信号 signal x / emit_signal / x.emit()",
       "connect 的写法与「断开连接」什么时候需要",
       "为什么信号优于到处 get_node 硬连线"
     ]},
     {id:"gd_export", n:"@export 与数据暴露", lv:"must", tm:"约 2 天", chk:"同一个敌人场景能在检查器里配出三种不同敌人", ts:[
       "@export 把参数暴露到检查器",
       "导出资源类型（Texture2D / PackedScene / Resource）",

const KEY="godot-roadmap-v2", KEY1="godot-roadmap-v1";
let state={};
try{ state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}; }catch(e){ state={}; }
/* 从旧版（按整节点存进度）尽力迁移一次 */
(function(){
  if(localStorage.getItem(KEY)) return;
  let old=null;
  try{ old=JSON.parse(localStorage.getItem(KEY1)||"null"); }catch(e){}
  if(!old) return;
  PHASES.forEach(p=>p.gs.forEach(g=>g.items.forEach(it=>{
    const v=old[it.id];
    if(v===2) it.ts.forEach((_,i)=>state[it.id+"::"+i]=2);
    else if(v===1 && it.ts.length) state[it.id+"::0"]=1;
  })));
  save();
})();

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} }
function tg(g,i){ return state[g.id+"::"+i]||0; }
function tset(g,i,v){ if(v===0) delete state[g.id+"::"+i]; else state[g.id+"::"+i]=v; save(); }
function gstat(g){
  let d=0,c=0;
  g.ts.forEach((_,i)=>{ const v=tg(g,i); if(v===2)d++; else if(v===1)c++; });
  if(d===g.ts.length) return 2;
  if(d>0||c>0) return 1;
  return 0;
}
const SLABEL=["未学","学习中","已学"];

/* ---- 视图状态 ---- */
let filter="all", hideSkip=false, q="", closed={};

function allGoals(){
  const out=[];
  PHASES.forEach((p,pi)=>p.gs.forEach(g=>g.items.forEach(it=>out.push({p,pi,it,g:g.name}))));
  return out;
}
function matches(it){
  if(hideSkip && it.lv==="skip") return false;
  if(filter==="must" && it.lv!=="must") return false;
  if(filter==="0"||filter==="1"||filter==="2"){
    const s=gstat(it); if(String(s)!==filter) return false;
  }
  if(q){
    const s=(it.n+" "+it.chk+" "+it.ts.join(" ")).toLowerCase();
    if(s.indexOf(q.toLowerCase())<0) return false;
  }
  return true;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function render(){
  const host=document.getElementById("app").firstElementChild;
  let html="", shown=0;
  PHASES.forEach((p,pi)=>{
    const items=[];
    p.gs.forEach(g=>g.items.forEach(it=>items.push(it)));
    const counted=items.filter(it=>it.lv!=="skip");
    let tot=0, done=0;
    counted.forEach(it=>{ tot+=it.ts.length; it.ts.forEach((_,i)=>{ if(tg(it,i)===2) done++; }); });
    const pct=tot?Math.round(done*100/tot):0;

    let body="";
    p.gs.forEach(g=>{
      const vis=g.items.filter(matches);
      if(!vis.length) return;
      shown+=vis.length;
      body+='<div class="grp"><div class="grp-h">'+esc(g.name)+'</div>';
      vis.forEach(it=>{
        const s=gstat(it);
        const d=it.ts.filter((_,i)=>tg(it,i)===2).length;
        const isClosed=!!closed[it.id];
        body+='<div class="goal s'+s+(isClosed?" closed":"")+'" data-id="'+it.id+'">'+
          '<div class="goal-h" data-act="toggle">'+
            '<span class="chev">▼</span>'+
            '<span class="gname">'+esc(it.n)+'</span>'+
            '<span class="lv '+it.lv+'">'+(it.lv==="must"?"必修":it.lv==="later"?"用到再学":"可跳过")+'</span>'+
            (it.tm?'<span class="tm">'+esc(it.tm)+'</span>':'')+
            '<span class="gp"><span class="tiny">'+d+'/'+it.ts.length+'</span>'+
            '<span class="gstat s'+s+'">'+SLABEL[s]+'</span></span>'+
          '</div>'+
          '<div class="goal-b">'+
            (it.chk?'<div class="chk"><b>验收</b>：'+esc(it.chk)+'</div>':'')+
            '<div class="tasks">'+
            it.ts.map((t,i)=>{
              const v=tg(it,i);
              return '<div class="task t'+v+'" data-act="task" data-i="'+i+'"><span class="bd"></span><span class="tx">'+esc(t)+'</span></div>';
            }).join("")+
            '</div>'+
          '</div>'+
        '</div>';
      });
      body+='</div>';
    });
    if(!body) return;

    html+='<section class="phase"><div class="phase-h">'+
      '<span class="ptag">阶段 '+pi+'</span>'+
      '<h2 class="ptitle">'+esc(p.t)+'</h2>'+
      '<span class="pwhen">'+esc(p.w)+'</span>'+
      '<div class="pmeta"><div class="mb"><i style="width:'+pct+'%"></i></div><span>'+done+'/'+tot+'</span></div>'+
      '</div>'+
      '<p class="pgoal"><b>阶段目标</b>：'+esc(p.goal)+'</p>'+
      body+'</section>';
  });

  host.innerHTML = shown? html : '<div class="empty">没有匹配的条目，换个筛选或者清空搜索试试。</div>';
  refreshStats();
}

function refreshStats(){
  let tot=0,done=0,c1=0,c0=0;
  allGoals().forEach(({it})=>{
    if(it.lv==="skip") return;
    tot+=it.ts.length;
    it.ts.forEach((_,i)=>{ const v=tg(it,i); if(v===2)done++; else if(v===1)c1++; else c0++; });
  });
  const pct=tot?Math.round(done*100/tot):0;
  document.getElementById("barAll").style.width=pct+"%";
  document.getElementById("pctAll").textContent=pct+"%";
  document.getElementById("fracAll").textContent=done+"/"+tot;
  document.getElementById("n2").textContent=done;
  document.getElementById("n1").textContent=c1;
  document.getElementById("n0").textContent=c0;
  const sk=allGoals().filter(x=>x.it.lv==="skip").reduce((a,x)=>a+x.it.ts.length,0);
  document.getElementById("skipNote").textContent="另有 "+sk+" 项可跳过内容不计入进度";

  // 接下来该做的 3 件事
  const nl=[], doneCount={};
  allGoals().forEach(({p,it})=>{
    if(it.lv==="skip") return;
    it.ts.forEach((t,i)=>{ if(tg(it,i)!==2) nl.push({phase:p.t,goal:it.n,task:t}); });
  });
  const list=document.getElementById("nextList");
  const show=nl.slice(0,3);
  list.innerHTML = show.length
    ? show.map(x=>'<li>'+esc(x.task)+'<span class="tiny"> · '+esc(x.goal)+' · '+esc(x.phase)+'</span></li>').join("")
    : '<li style="list-style:none;margin-left:-20px;color:#56d364">全部完成了 🎉</li>';
  document.getElementById("nextHint").textContent = show.length
    ? "按顺序取前 3 个未完成的小目标；标成「已学」后自动往下走。"
    : "整张图已清空，可以考虑做下一个项目了。";
}

/* ---- 交互 ---- */
document.getElementById("app").addEventListener("click",e=>{
  const goal=e.target.closest(".goal"); if(!goal) return;
  const id=goal.dataset.id;
  const obj=allGoals().find(x=>x.it.id===id); if(!obj) return;
  const it=obj.it;

  const taskEl=e.target.closest(".task");
  if(taskEl){
    const i=+taskEl.dataset.i;
    const cur=tg(it,i);
    const nxt=e.shiftKey? (cur+2)%3 : (cur+1)%3;
    tset(it,i,nxt);
    reRenderGoal(goal,it);
    refreshStats();
    return;
  }
  const head=e.target.closest(".goal-h");
  if(head){
    if(e.shiftKey){
      const cur=gstat(it);
      const nxt=(cur+1)%3;
      it.ts.forEach((_,i)=>tset(it,i,nxt));
      reRenderGoal(goal,it); refreshStats();
    }else{
      closed[id]=!closed[id];
      goal.classList.toggle("closed",!!closed[id]);
    }
  }
});

function reRenderGoal(el,it){
  const s=gstat(it), d=it.ts.filter((_,i)=>tg(it,i)===2).length;
  el.className="goal s"+s+(el.classList.contains("closed")?" closed":"");
  el.querySelector(".gstat").className="gstat s"+s;
  el.querySelector(".gstat").textContent=SLABEL[s];
  el.querySelector(".gp .tiny").textContent=d+"/"+it.ts.length;
  el.querySelectorAll(".task").forEach((t,i)=>{
    const v=tg(it,i);
    t.className="task t"+v;
  });
}

document.getElementById("filters").addEventListener("click",e=>{
  const chip=e.target.closest(".chip"); if(!chip) return;
  if(chip.id==="hideSkip"){
    hideSkip=!hideSkip; chip.classList.toggle("on",hideSkip); render(); return;
  }
  document.querySelectorAll("#filters .chip[data-f]").forEach(c=>c.classList.remove("on"));
  chip.classList.add("on"); filter=chip.dataset.f; render();
});

let qt=null;
document.getElementById("q").addEventListener("input",e=>{
  clearTimeout(qt);
  qt=setTimeout(()=>{ q=e.target.value.trim(); render(); },120);
});

document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({v:2,at:new Date().toISOString(),state},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="godot-roadmap-backup.json";
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick=()=>{
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        const s=o.state||o;
        if(!s||typeof s!=="object") throw new Error("格式不对");
        state=s; save(); render();
        alert("已恢复进度。");
      }catch(err){ alert("恢复失败："+err.message); }
    };
    r.readAsText(f);
  };
  inp.click();
};
document.getElementById("resetBtn").onclick=()=>{
  if(!confirm("清空全部进度？此操作不可撤销。")) return;
  state={}; save(); render();
};

render();
</script>
</body>
</html>
